name: Build Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Optional version label (default: tag name or sha-<commit>)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image and version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.build_version }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="sha-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version="$GITHUB_REF_NAME"; fi
          if [[ -n "$INPUT_VERSION" ]]; then version="$INPUT_VERSION"; fi
          [[ "$version" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]] || { echo 'Invalid version label' >&2; exit 1; }
          printf 'image=%s\nversion=%s\n' "$image" "$version" >> "$GITHUB_OUTPUT"

      - name: Test upgrade tooling and Compose example
        run: |
          bash -n scripts/upgrade.sh
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          touch .env
          docker compose -f compose.core.example.yml config --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }},enable=${{ inputs.build_version != '' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }},enable=${{ inputs.build_version != '' || startsWith(github.ref, 'refs/tags/v') }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Build native image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: codex2apicore-smoke:local
          build-args: |
            BUILD_VERSION=${{ steps.release.outputs.version }}
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha,scope=core-image
          cache-to: type=gha,scope=core-image,mode=max
          provenance: false

      - name: Verify startup, health version and admin page
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f codex2apicore-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name codex2apicore-smoke --tmpfs /data \
            -e DATABASE_DRIVER=sqlite -e DATABASE_PATH=/data/codex2api.db \
            -e CACHE_DRIVER=memory -e CODEX_PORT=8080 -e CODEX_BIND=0.0.0.0 \
            -e ADMIN_SECRET=ci-smoke-only-not-a-real-admin-secret \
            -p 127.0.0.1:18080:8080 codex2apicore-smoke:local
          ready=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:18080/health > /tmp/core-health.json; then ready=true; break; fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then docker logs codex2apicore-smoke; exit 1; fi
          python3 - <<'PY'
          import json, os
          with open('/tmp/core-health.json') as stream:
              health = json.load(stream)
          assert health.get('status') == 'ok', health
          assert health.get('build_version') == os.environ['EXPECTED_VERSION'], health
          print('Image health and version verified:', health['build_version'])
          PY
          curl --fail --silent --max-time 10 http://127.0.0.1:18080/admin/ > /tmp/core-admin.html
          python3 - <<'PY'
          from pathlib import Path
          assert 'assets/' in Path('/tmp/core-admin.html').read_text(), 'Embedded frontend missing'
          PY

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 and arm64 images
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.release.outputs.version }}
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha,scope=core-image
          cache-to: type=gha,scope=core-image,mode=max
          provenance: false

      - name: Record published image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          {
            echo '### Published Codex account-service image'
            printf '\n`%s@%s`\n' "$IMAGE" "$DIGEST"
            printf '\nCommit tag: `%s:sha-%s`\n' "$IMAGE" "$GITHUB_SHA"
            echo
            echo 'First publication defaults to private on GHCR. Set this package to public for anonymous pulls, or log in on the server with read:packages access.'
            echo 'Existing deployments: preserve the original Compose project and mounts; use scripts/upgrade.sh.'
          } >> "$GITHUB_STEP_SUMMARY"
